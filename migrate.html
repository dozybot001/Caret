<!DOCTYPE html>
<!-- 迁移页面 - 迁到新地址后，新地址在弹出窗口里打开旧地址的这个页面：读出这个浏览器里旧地址的设置和对话，只发给新地址；新地址确认写好后，删掉这里的数据 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>迁移数据 · Caret</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3Erect%7Bfill:%231a1917%7D.c%7Bfill:%23f06b32%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23e8e8e8%7D%7D%3C/style%3E%3Crect x='6' y='24' width='17' height='24'/%3E%3Crect class='c' x='28.5' y='8' width='7' height='48'/%3E%3Crect x='41' y='24' width='17' height='24'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:image" content="https://caret.tenon.asia/assets/share.png">
    <meta name="twitter:card" content="summary">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --ink: #1a1917;
            --muted: #5c5a55;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --ink: #e8e8e8;
                --muted: #a0a0a0;
            }
        }
        body {
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
            line-height: 1.7;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 20px;
            font-weight: 600;
        }
        p {
            margin: 0;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <h1>迁移数据 / Moving your data</h1>
        <p id="status-zh">正在读取这个浏览器里的设置和对话。</p>
        <p id="status-en">Reading the settings and conversations in this browser.</p>
    </main>
    <script>
        // 新地址。数据只发给这个来源，别的网页打开这个页面也收不到；也只认这个来源发回的确认
        const TARGET = 'https://caret.tenonai.cn';
        const DATABASE = 'CaretStore';
        const STORES = ['config', 'projects', 'sessions', 'sessionData'];

        function show(zh, en) {
            document.getElementById('status-zh').textContent = zh;
            document.getElementById('status-en').textContent = en;
        }

        function settle(request) {
            return new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        /** 读出旧数据，不改动这里的存储；没有数据时返回 null */
        async function collect() {
            const preferences = localStorage.getItem('caret_preferences');
            // 先确认数据库存在，直接打开会建一个空库
            if (!(await indexedDB.databases()).some(item => item.name === DATABASE)) {
                return preferences ? { config: null, projects: [], sessions: [], sessionData: [], preferences } : null;
            }
            const db = await settle(indexedDB.open(DATABASE));
            const names = STORES.filter(name => db.objectStoreNames.contains(name));
            const transaction = db.transaction(names, 'readonly');
            const read = (name, method, query) => (names.includes(name)
                ? settle(transaction.objectStore(name)[method](query))
                : Promise.resolve(undefined));
            const [config, projects = [], sessions = [], keys = [], contents = []] = await Promise.all([
                read('config', 'get', 'appConfig'),
                read('projects', 'getAll'),
                read('sessions', 'getAll'),
                read('sessionData', 'getAllKeys'),
                read('sessionData', 'getAll')
            ]);
            db.close();
            if (!config && !sessions.length && !preferences) return null;
            return {
                config: config ?? null,
                // 文件夹授权不能带到别的域名，项目在新地址打开同名文件夹时重新关联
                projects: projects.map(project => ({ ...project, handle: null })),
                sessions,
                sessionData: keys.map((key, index) => [key, contents[index]]),
                preferences
            };
        }

        /** 删掉这里的全部 Caret 数据，包括 API Key 和文件夹授权 */
        function clear() {
            localStorage.removeItem('caret_preferences');
            return new Promise((resolve, reject) => {
                const request = indexedDB.deleteDatabase(DATABASE);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
                request.onblocked = () => show('其他标签页还开着这个地址的 Caret，关掉它们后会继续删除。',
                    'Caret is still open at this address in another tab. Close it to finish deleting.');
            });
        }

        async function main() {
            if (!window.opener || location.origin === TARGET) {
                show('这个页面用于把设置和对话迁到新地址，请从 Caret 欢迎页的迁移入口打开。',
                    'This page moves your settings and conversations to the new address. Open it from the welcome page of Caret.');
                return;
            }
            let data;
            try {
                data = await collect();
            } catch (error) {
                show(`读取失败：${error.message}`, `Could not read the data: ${error.message}`);
                return;
            }
            // 新地址写好后回发确认，收到确认才删掉这里的数据
            let isClearing = false;
            window.addEventListener('message', async (event) => {
                if (event.origin !== TARGET || event.source !== window.opener || event.data?.type !== 'caret-migration-saved' || isClearing) return;
                isClearing = true;
                try {
                    await clear();
                    window.opener.postMessage({ type: 'caret-migration-cleared' }, TARGET);
                    show('已迁到新地址，这里的数据已删除。', 'Moved to the new address. The data here has been deleted.');
                } catch (error) {
                    show(`删除失败：${error.message}`, `Could not delete the data here: ${error.message}`);
                }
            });
            window.opener.postMessage({ type: 'caret-migration', ...(data ?? { empty: true }) }, TARGET);
            show('已发给新地址，等它确认写好。', 'Sent to the new address. Waiting for it to confirm.');
        }

        main();
    </script>
</body>
</html>
