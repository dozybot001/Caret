<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在维护 · Caret</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3Erect%7Bfill:%231a1917%7D.c%7Bfill:%23f06b32%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23e8e8e8%7D%7D%3C/style%3E%3Crect x='6' y='24' width='17' height='24'/%3E%3Crect class='c' x='28.5' y='8' width='7' height='48'/%3E%3Crect x='41' y='24' width='17' height='24'/%3E%3C/svg%3E">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --ink: #1a1917;
            --muted: #5c5a55;
            --button: #1a1917;
            --button-ink: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --ink: #e8e8e8;
                --muted: #a0a0a0;
                --button: #e8e8e8;
                --button-ink: #000000;
            }
        }
        body {
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
            line-height: 1.7;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            margin: 0;
            color: var(--muted);
        }
        a {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 16px;
            background: var(--button);
            color: var(--button-ink);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>正在维护 / Under maintenance</h1>
        <p>Caret 正在维护，很快恢复。你的设置和对话保存在自己的浏览器里，不受影响。</p>
        <p>Caret is under maintenance and will be back soon. Your settings and conversations stay in your browser and are not affected.</p>
        <a href="/">重新加载 / Reload</a>
    </main>
</body>
</html>
