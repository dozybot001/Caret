<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 · Caret</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23f06b32'/%3E%3Cpath d='M13 16H51V28H38V48H26V28H13Z' fill='%23fff'/%3E%3C/svg%3E">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --ink: #1a1917;
            --muted: #5c5a55;
            --button: #1a1917;
            --button-ink: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --ink: #e8e8e8;
                --muted: #a0a0a0;
                --button: #e8e8e8;
                --button-ink: #000000;
            }
        }
        body {
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
            line-height: 1.7;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            margin: 0;
            color: var(--muted);
        }
        a {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 16px;
            background: var(--button);
            color: var(--button-ink);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>页面不存在 / Page not found</h1>
        <p>这个地址没有内容，可能已经移动或删除。</p>
        <p>Nothing is here. The page may have moved or been removed.</p>
        <a href="/">返回 Caret / Back to Caret</a>
    </main>
</body>
</html>
