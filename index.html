<!-- 应用主页面 - Caret 的入口 HTML 文件，包含所有 UI 结构和资源引用 -->
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data:; worker-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
    <meta name="description" content="Caret 是只有读、写、改三个工具的 Coding Agent：不用安装，不执行命令，改动由你确认后写入。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Caret">
    <meta property="og:title" content="Caret：只有三个工具的 Coding Agent">
    <meta property="og:description" content="Caret 是只有读、写、改三个工具的 Coding Agent：不用安装，不执行命令，改动由你确认后写入。">
    <meta property="og:url" content="https://caret.tenon.asia/">
    <meta property="og:image" content="https://caret.tenon.asia/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Caret，只有三个工具的 Coding Agent：read、write、edit">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary_large_image">
    <title>Caret</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3Erect%7Bfill:%231a1917%7D.c%7Bfill:%23f06b32%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23e8e8e8%7D%7D%3C/style%3E%3Crect x='6' y='24' width='17' height='24'/%3E%3Crect class='c' x='28.5' y='8' width='7' height='48'/%3E%3Crect x='41' y='24' width='17' height='24'/%3E%3C/svg%3E">
    <script>
        // 首屏渲染前确定主题，避免闪烁
        try {
            const saved = JSON.parse(localStorage.getItem('caret_preferences')) || {};
            const wanted = new URLSearchParams(location.search).get('theme') || saved.theme;
            const dark = wanted === 'dark' || (wanted !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
            // 读取失败时使用默认主题
        }
        // 启动一直没有完成时给出提示。启动完成后加载层已经移除
        setTimeout(() => document.getElementById('app-loading')?.classList.add('is-failed'), 45000);
    </script>
    <link href="css/codicons/codicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-loading" role="status">
        <svg class="app-loading-mark" viewBox="0 0 64 64" role="img" aria-label="Caret"><rect x="6" y="24" width="17" height="24" fill="currentColor"/><rect class="app-loading-cursor" x="28.5" y="8" width="7" height="48" fill="#f06b32"/><rect x="41" y="24" width="17" height="24" fill="currentColor"/></svg>
        <div class="app-loading-error">
            <p>Caret 没有加载成功，请检查网络后刷新页面。</p>
            <p>Caret could not load. Check your network and reload.</p>
            <button type="button" class="btn btn-text btn-primary" onclick="location.reload()">刷新 / Reload</button>
        </div>
    </div>
    <div id="app">
        <nav id="sidebar">
            <div class="sidebar-top">
                <svg class="sidebar-mark" viewBox="0 0 64 64" role="img" data-i18n-label="brand.label"><rect x="6" y="24" width="17" height="24" fill="currentColor"/><rect x="28.5" y="8" width="7" height="48" fill="#f06b32"/><rect x="41" y="24" width="17" height="24" fill="currentColor"/></svg>
                <button type="button" class="btn" id="btn-toggle-tree" data-i18n-title="sidebar.files">
                    <i class="codicon codicon-files"></i>
                </button>
                <button type="button" class="btn" id="btn-open-folder" data-i18n-title="sidebar.open">
                    <i class="codicon codicon-folder-opened"></i>
                </button>
                <button type="button" class="btn" id="btn-toggle-chat" data-i18n-title="sidebar.agent">
                    <i class="codicon codicon-comment"></i>
                </button>
            </div>

            <div class="sidebar-bottom">
                <button type="button" class="btn" id="btn-settings" data-i18n-title="settings.title">
                    <i class="codicon codicon-settings-gear"></i>
                </button>
            </div>
        </nav>

        <aside id="file-tree-panel">
            <div id="file-tree"></div>
        </aside>
        <div id="resize-tree" class="resizer" role="separator" tabindex="0" aria-orientation="vertical" data-i18n-label="layout.resizeTree"></div>

        <main id="editor-area">
            <div id="tabs-bar"></div>
            <div id="monaco-container"></div>
            <div id="welcome">
                <div class="welcome-inner">
                    <h1 class="product-logo" data-i18n-label="brand.label">Caret<svg class="product-logo-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#f06b32"/><path d="M13 16H51V28H38V48H26V28H13Z" fill="#fff"/></svg></h1>
                    <p class="welcome-tagline" data-i18n="welcome.tagline"></p>
                    <p class="welcome-intro" data-i18n="welcome.intro"></p>
                    <button type="button" id="btn-welcome-open" class="btn btn-text btn-primary" data-i18n="welcome.open"></button>
                    <dl class="welcome-tools">
                        <div><dt>read</dt><dd data-i18n="welcome.read"></dd></div>
                        <div><dt>write</dt><dd data-i18n="welcome.write"></dd></div>
                        <div><dt>edit</dt><dd data-i18n="welcome.edit"></dd></div>
                    </dl>
                    <p class="welcome-note" id="welcome-note" data-i18n="welcome.note"></p>
                    <dl class="welcome-points">
                        <div><dt data-i18n="welcome.pointOpen"></dt><dd data-i18n="welcome.pointOpenBody"></dd></div>
                        <div><dt data-i18n="welcome.pointReview"></dt><dd data-i18n="welcome.pointReviewBody"></dd></div>
                        <div><dt data-i18n="welcome.pointPrompt"></dt><dd data-i18n="welcome.pointPromptBody"></dd></div>
                        <div><dt data-i18n="welcome.pointMemory"></dt><dd data-i18n="welcome.pointMemoryBody"></dd></div>
                    </dl>
                    <p class="filing"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">湘ICP备2026031578号-1</a><a href="https://beian.mps.gov.cn/#/query/webSearch?code=43132202001134" target="_blank" rel="noopener noreferrer">湘公网安备43132202001134号</a></p>
                </div>
            </div>
        </main>

        <div id="resize-chat" class="resizer" role="separator" tabindex="0" aria-orientation="vertical" data-i18n-label="layout.resizeChat"></div>
        <aside id="chat-panel">
            <div class="panel-header">
                <span class="panel-title">Agent</span>
                <div class="panel-actions">
                    <button type="button" id="btn-history" class="btn" data-i18n-title="history.title">
                        <i class="codicon codicon-history"></i>
                    </button>
                    <button type="button" id="btn-new-task" class="btn" data-i18n-title="chat.newTask">
                        <i class="codicon codicon-add"></i>
                    </button>
                </div>
            </div>
            <div id="history-panel" class="hidden">
                <div class="history-head">
                    <span class="history-heading" data-i18n="history.title"></span>
                    <button type="button" id="btn-clear-history" class="btn btn-text btn-text-chat hidden" data-i18n="history.clear"></button>
                </div>
                <div id="history-list"></div>
                <p id="history-empty" class="hidden" data-i18n="history.empty"></p>
            </div>
            <div id="chat-messages" role="log" aria-live="polite"></div>
            <div id="changes-panel" class="hidden">
                <div class="changes-head">
                    <span id="changes-summary"></span>
                    <button type="button" id="btn-discard-all" class="btn btn-text btn-text-chat" data-i18n="changes.discardAll"></button>
                    <button type="button" id="btn-apply" class="btn btn-text btn-primary" data-i18n="changes.apply"></button>
                </div>
                <div id="changes-conflict" class="hidden">
                    <p id="changes-conflict-text"></p>
                    <div class="changes-conflict-actions">
                        <button type="button" id="btn-conflict-cancel" class="btn btn-text btn-text-chat" data-i18n="changes.cancel"></button>
                        <button type="button" id="btn-overwrite" class="btn btn-text btn-primary" data-i18n="changes.overwrite"></button>
                    </div>
                </div>
                <div id="changes-list"></div>
            </div>
            <form id="chat-input-area">
                <textarea id="chat-input" rows="2"></textarea>
                <div class="chat-input-foot">
                    <div class="chat-chips">
                        <button type="button" id="btn-model" class="chat-chip" aria-haspopup="listbox"><i class="codicon codicon-plug"></i><span></span><i class="codicon codicon-chevron-up"></i></button>
                        <button type="button" id="btn-effort" class="chat-chip hidden" aria-haspopup="listbox"><i class="codicon codicon-dashboard"></i><span></span><i class="codicon codicon-chevron-up"></i></button>
                    </div>
                    <div class="chat-input-actions">
                        <button type="button" id="context-ring">
                            <svg viewBox="0 0 26 26" aria-hidden="true">
                                <circle class="context-track" cx="13" cy="13" r="12" pathLength="100"></circle>
                                <circle class="context-arc" cx="13" cy="13" r="12" pathLength="100"></circle>
                            </svg>
                            <span></span>
                        </button>
                        <button type="submit" id="btn-send-chat" class="btn">
                            <i class="codicon codicon-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </form>
        </aside>

        <div id="notification-container"></div>
        <div id="drop-overlay"><span data-i18n="tree.drop"></span></div>
    </div>

    <dialog id="confirm-dialog" aria-describedby="confirm-message">
        <p id="confirm-message"></p>
        <div class="confirm-actions">
            <button type="button" id="confirm-cancel" class="btn btn-text btn-text-chat" data-i18n="changes.cancel"></button>
            <button type="button" id="confirm-ok" class="btn btn-text btn-primary" data-i18n="confirm.discard"></button>
        </div>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-heading" tabindex="-1">
        <nav class="settings-nav" aria-labelledby="settings-heading">
            <h2 id="settings-heading" data-i18n="settings.title"></h2>
            <button type="button" class="settings-nav-item" data-go="model"><i class="codicon codicon-plug"></i><span data-i18n="settings.model"></span></button>
            <button type="button" class="settings-nav-item" data-go="agent"><i class="codicon codicon-comment"></i><span data-i18n="settings.agent"></span></button>
            <button type="button" class="settings-nav-item" data-go="editor"><i class="codicon codicon-code"></i><span data-i18n="settings.editor"></span></button>
            <button type="button" class="settings-nav-item" data-go="files"><i class="codicon codicon-files"></i><span data-i18n="settings.files"></span></button>
            <button type="button" class="settings-nav-item" data-go="appearance"><i class="codicon codicon-symbol-color"></i><span data-i18n="settings.appearance"></span></button>
            <button type="button" class="settings-nav-item" data-go="data"><i class="codicon codicon-database"></i><span data-i18n="settings.data"></span></button>
            <button type="button" class="settings-nav-item" data-go="about"><i class="codicon codicon-info"></i><span data-i18n="settings.about"></span></button>
        </nav>

        <div class="settings-main">
            <header class="dialog-head">
                <button type="button" id="settings-back" class="btn hidden" data-i18n-title="settings.back">
                    <i class="codicon codicon-arrow-left"></i>
                </button>
                <h3 id="settings-title"></h3>
                <button type="button" id="settings-info" class="info hidden" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                <button type="button" id="settings-close" class="btn" data-i18n-title="settings.close">
                    <i class="codicon codicon-close"></i>
                </button>
            </header>

            <div class="dialog-body">
                <section data-page="model">
                    <div class="field">
                        <span class="field-label" id="provider-label" data-i18n="settings.provider"></span>
                        <button type="button" id="provider-trigger" class="select-trigger" aria-haspopup="listbox" aria-labelledby="provider-label"><span></span><i class="codicon codicon-chevron-down"></i></button>
                    </div>
                    <div class="field hidden" id="field-base-url">
                        <label class="field-label" for="input-base-url" data-i18n="settings.baseUrl"></label>
                        <input id="input-base-url" type="url" placeholder="https://" autocomplete="off" spellcheck="false">
                    </div>
                    <div class="field">
                        <div class="field-label">
                            <label for="input-api-key" data-i18n="settings.apiKey"></label>
                            <button type="button" class="info" data-tip="settings.apiKeyTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                            <a id="key-link" class="field-link" target="_blank" rel="noopener noreferrer" data-i18n="settings.getKey"></a>
                        </div>
                        <input id="input-api-key" type="password" placeholder="sk-" autocomplete="off" spellcheck="false">
                        <button type="button" id="btn-clear-key" class="field-link hidden" data-i18n="settings.clearKey"></button>
                    </div>
                    <div class="field">
                        <div class="field-label">
                            <span id="model-label" data-i18n="settings.defaultModel"></span>
                            <button type="button" class="info" data-tip="settings.defaultModelTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                        </div>
                        <button type="button" id="model-trigger" class="select-trigger" aria-haspopup="listbox" aria-labelledby="model-label"><span></span><i class="codicon codicon-chevron-down"></i></button>
                    </div>
                    <div class="field hidden" id="field-effort">
                        <div class="field-label">
                            <span id="effort-label" data-i18n="settings.defaultEffort"></span>
                            <button type="button" class="info" data-tip="settings.defaultEffortTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                        </div>
                        <button type="button" id="effort-trigger" class="select-trigger" aria-haspopup="listbox" aria-labelledby="effort-label"><span></span><i class="codicon codicon-chevron-down"></i></button>
                    </div>
                    <p id="connection-status" class="settings-status" role="status"></p>
                </section>

                <section data-page="agent" class="hidden">
                    <div class="field">
                        <div class="field-label">
                            <label for="input-instructions" data-i18n="settings.instructions"></label>
                            <button type="button" class="info" data-tip="settings.instructionsTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                        </div>
                        <textarea id="input-instructions" data-setting="instructions" data-i18n-placeholder="settings.instructionsHint" maxlength="8000" spellcheck="false"></textarea>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="send-key-label" data-i18n="settings.sendKey"></span><button type="button" class="info" data-tip="settings.sendKeyTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <div class="segments" role="group" data-setting="sendKey" aria-labelledby="send-key-label"><button type="button" data-value="enter">Enter</button><button type="button" data-value="mod" id="send-key-mod"></button></div>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="max-steps-label" data-i18n="settings.maxSteps"></span><button type="button" class="info" data-tip="settings.maxStepsTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <div class="segments" role="group" data-setting="maxSteps" aria-labelledby="max-steps-label"><button type="button" data-value="20">20</button><button type="button" data-value="40">40</button><button type="button" data-value="80">80</button></div>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="context-limit-label" data-i18n="settings.contextLimit"></span><button type="button" class="info" data-tip="settings.contextLimitTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <div class="segments" role="group" data-setting="contextLimit" aria-labelledby="context-limit-label"><button type="button" data-value="50000" data-i18n="settings.limit50"></button><button type="button" data-value="100000" data-i18n="settings.limit100"></button><button type="button" data-value="200000" data-i18n="settings.limit200"></button></div>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="remember-rules-label" data-i18n="settings.rememberRules"></span><button type="button" class="info" data-tip="settings.rememberRulesTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <button type="button" class="switch" role="switch" data-setting="rememberRules" aria-labelledby="remember-rules-label"></button>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="follow-agent-label" data-i18n="settings.followAgent"></span><button type="button" class="info" data-tip="settings.followAgentTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <button type="button" class="switch" role="switch" data-setting="followAgent" aria-labelledby="follow-agent-label"></button>
                    </div>
                    <button type="button" class="settings-link" data-go="context"><span data-i18n="context.title"></span><i class="codicon codicon-chevron-right"></i></button>
                </section>

                <section data-page="editor" class="hidden">
                    <div class="setting-row">
                        <div class="field-label"><span id="tab-size-label" data-i18n="settings.tabSize"></span><button type="button" class="info" data-tip="settings.tabSizeTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <div class="segments" role="group" data-setting="tabSize" aria-labelledby="tab-size-label"><button type="button" data-value="0" data-i18n="settings.tabAuto"></button><button type="button" data-value="2">2</button><button type="button" data-value="4">4</button><button type="button" data-value="8">8</button></div>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="cursor-style-label" data-i18n="settings.cursorStyle"></span></div>
                        <div class="segments" role="group" data-setting="cursorStyle" aria-labelledby="cursor-style-label"><button type="button" data-value="line" data-i18n="settings.cursorLine"></button><button type="button" data-value="block" data-i18n="settings.cursorBlock"></button><button type="button" data-value="underline" data-i18n="settings.cursorUnderline"></button></div>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="word-wrap-label" data-i18n="settings.wordWrap"></span></div>
                        <button type="button" class="switch" role="switch" data-setting="wordWrap" aria-labelledby="word-wrap-label"></button>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="line-numbers-label" data-i18n="settings.lineNumbers"></span></div>
                        <button type="button" class="switch" role="switch" data-setting="lineNumbers" aria-labelledby="line-numbers-label"></button>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="minimap-label" data-i18n="settings.minimap"></span></div>
                        <button type="button" class="switch" role="switch" data-setting="minimap" aria-labelledby="minimap-label"></button>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="whitespace-label" data-i18n="settings.showWhitespace"></span></div>
                        <button type="button" class="switch" role="switch" data-setting="showWhitespace" aria-labelledby="whitespace-label"></button>
                    </div>
                    <h4 class="section-title" data-i18n="settings.review"></h4>
                    <div class="setting-row">
                        <div class="field-label"><span id="diff-view-label" data-i18n="settings.diffView"></span><button type="button" class="info" data-tip="settings.diffViewTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <div class="segments" role="group" data-setting="diffView" aria-labelledby="diff-view-label"><button type="button" data-value="inline" data-i18n="settings.diffInline"></button><button type="button" data-value="sideBySide" data-i18n="settings.diffSideBySide"></button></div>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="fold-unchanged-label" data-i18n="settings.foldUnchanged"></span></div>
                        <button type="button" class="switch" role="switch" data-setting="foldUnchanged" aria-labelledby="fold-unchanged-label"></button>
                    </div>
                </section>

                <section data-page="files" class="hidden">
                    <div class="field">
                        <div class="field-label">
                            <label for="input-ignore-rules" data-i18n="settings.ignoreRules"></label>
                            <button type="button" class="info" data-tip="settings.ignoreRulesTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                        </div>
                        <textarea id="input-ignore-rules" data-setting="ignoreRules" data-i18n-placeholder="settings.ignoreRulesHint" spellcheck="false"></textarea>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="git-status-label" data-i18n="settings.gitStatus"></span><button type="button" class="info" data-tip="settings.gitStatusTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <button type="button" class="switch" role="switch" data-setting="gitStatus" aria-labelledby="git-status-label"></button>
                    </div>
                    <div class="setting-row">
                        <div class="field-label"><span id="preview-tabs-label" data-i18n="settings.previewTabs"></span><button type="button" class="info" data-tip="settings.previewTabsTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></div>
                        <button type="button" class="switch" role="switch" data-setting="previewTabs" aria-labelledby="preview-tabs-label"></button>
                    </div>
                </section>

                <section data-page="appearance" class="hidden">
                    <div class="setting-row">
                        <span class="field-label" id="theme-label" data-i18n="settings.theme"></span>
                        <div class="segments" role="group" aria-labelledby="theme-label">
                            <button type="button" data-theme-option="system" data-i18n="settings.themeSystem"></button>
                            <button type="button" data-theme-option="light" data-i18n="settings.themeLight"></button>
                            <button type="button" data-theme-option="dark" data-i18n="settings.themeDark"></button>
                        </div>
                    </div>
                    <div class="setting-row">
                        <span class="field-label" id="language-label" data-i18n="settings.language"></span>
                        <div class="segments" role="group" aria-labelledby="language-label">
                            <button type="button" data-lang-option="zh">简体中文</button>
                            <button type="button" data-lang-option="en">English</button>
                        </div>
                    </div>
                    <div class="setting-row">
                        <div class="field-label">
                            <label for="input-font-family" data-i18n="settings.fontFamily"></label>
