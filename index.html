<!-- 应用主页面 - Caret 的入口 HTML 文件，包含所有 UI 结构和资源引用 -->
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data:; worker-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
    <meta name="description" content="Caret 是只有读、写、改三个工具的 Coding Agent：不用安装，不执行命令，改动由你确认后写入。">
    <title>Caret</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3Erect%7Bfill:%231a1917%7D.c%7Bfill:%23f06b32%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23e8e8e8%7D%7D%3C/style%3E%3Crect x='6' y='24' width='17' height='24'/%3E%3Crect class='c' x='28.5' y='8' width='7' height='48'/%3E%3Crect x='41' y='24' width='17' height='24'/%3E%3C/svg%3E">
    <script>
        // 首屏渲染前确定主题，避免闪烁
        try {
            const saved = JSON.parse(localStorage.getItem('caret_preferences')) || {};
            const wanted = new URLSearchParams(location.search).get('theme') || saved.theme;
            const dark = wanted === 'dark' || (wanted !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
            // 读取失败时使用默认主题
        }
    </script>
    <link href="css/codicons/codicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <nav id="sidebar">
            <div class="sidebar-top">
                <svg class="sidebar-mark" viewBox="0 0 64 64" role="img" data-i18n-label="brand.label"><rect x="6" y="24" width="17" height="24" fill="currentColor"/><rect x="28.5" y="8" width="7" height="48" fill="#f06b32"/><rect x="41" y="24" width="17" height="24" fill="currentColor"/></svg>
                <button type="button" class="btn" id="btn-toggle-tree" data-i18n-title="sidebar.files">
                    <i class="codicon codicon-files"></i>
                </button>
                <button type="button" class="btn" id="btn-open-folder" data-i18n-title="sidebar.open">
                    <i class="codicon codicon-folder-opened"></i>
                </button>
                <button type="button" class="btn" id="btn-toggle-chat" data-i18n-title="sidebar.agent">
                    <i class="codicon codicon-comment"></i>
                </button>
            </div>

            <div class="sidebar-bottom">
                <button type="button" class="btn" id="btn-settings" data-i18n-title="settings.title">
                    <i class="codicon codicon-settings-gear"></i>
                </button>
            </div>
        </nav>

        <aside id="file-tree-panel">
            <div id="file-tree"></div>
        </aside>
        <div id="resize-tree" class="resizer" role="separator" tabindex="0" aria-orientation="vertical" data-i18n-label="layout.resizeTree"></div>

        <main id="editor-area">
            <div id="tabs-bar"></div>
            <div id="monaco-container"></div>
            <div id="welcome">
                <div class="welcome-inner">
                    <h1 class="product-logo" data-i18n-label="brand.label">Caret<svg class="product-logo-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#f06b32"/><path d="M13 16H51V28H38V48H26V28H13Z" fill="#fff"/></svg></h1>
                    <p class="welcome-tagline" data-i18n="welcome.tagline"></p>
                    <dl class="welcome-tools">
                        <div><dt>read</dt><dd data-i18n="welcome.read"></dd></div>
                        <div><dt>write</dt><dd data-i18n="welcome.write"></dd></div>
                        <div><dt>edit</dt><dd data-i18n="welcome.edit"></dd></div>
                    </dl>
                    <p class="welcome-note" id="welcome-note" data-i18n="welcome.note"></p>
                    <button type="button" id="btn-welcome-open" class="btn btn-text btn-primary" data-i18n="welcome.open"></button>
                    <p class="filing"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">湘ICP备2026031578号-1</a><a href="https://beian.mps.gov.cn/#/query/webSearch?code=43132202001134" target="_blank" rel="noopener noreferrer">湘公网安备43132202001134号</a></p>
                </div>
            </div>
        </main>

        <div id="resize-chat" class="resizer" role="separator" tabindex="0" aria-orientation="vertical" data-i18n-label="layout.resizeChat"></div>
        <aside id="chat-panel">
            <div class="panel-header">
                <span class="panel-title">Agent</span>
                <div class="panel-actions">
                    <button type="button" id="btn-history" class="btn" data-i18n-title="history.title">
                        <i class="codicon codicon-history"></i>
                    </button>
                    <button type="button" id="btn-new-task" class="btn" data-i18n-title="chat.newTask">
                        <i class="codicon codicon-add"></i>
                    </button>
                </div>
            </div>
            <div id="history-panel" class="hidden">
                <div class="history-head">
                    <span class="history-heading" data-i18n="history.title"></span>
                    <button type="button" id="btn-clear-history" class="btn btn-text btn-text-chat hidden" data-i18n="history.clear"></button>
                </div>
                <div id="history-list"></div>
                <p id="history-empty" class="hidden" data-i18n="history.empty"></p>
            </div>
            <div id="chat-messages" role="log" aria-live="polite"></div>
            <div id="changes-panel" class="hidden">
                <div class="changes-head">
                    <span id="changes-summary"></span>
                    <button type="button" id="btn-discard-all" class="btn btn-text btn-text-chat" data-i18n="changes.discardAll"></button>
                    <button type="button" id="btn-apply" class="btn btn-text btn-primary" data-i18n="changes.apply"></button>
                </div>
                <div id="changes-conflict" class="hidden">
                    <p id="changes-conflict-text"></p>
                    <div class="changes-conflict-actions">
                        <button type="button" id="btn-conflict-cancel" class="btn btn-text btn-text-chat" data-i18n="changes.cancel"></button>
                        <button type="button" id="btn-overwrite" class="btn btn-text btn-primary" data-i18n="changes.overwrite"></button>
                    </div>
                </div>
                <div id="changes-list"></div>
            </div>
            <form id="chat-input-area">
                <textarea id="chat-input" rows="2"></textarea>
                <div class="chat-input-foot">
                    <div class="chat-chips">
                        <button type="button" id="btn-model" class="chat-chip" aria-haspopup="listbox"><i class="codicon codicon-plug"></i><span></span><i class="codicon codicon-chevron-up"></i></button>
                        <button type="button" id="btn-effort" class="chat-chip hidden" aria-haspopup="listbox"><i class="codicon codicon-dashboard"></i><span></span><i class="codicon codicon-chevron-up"></i></button>
                    </div>
                    <div class="chat-input-actions">
                        <button type="button" id="context-ring">
                            <svg viewBox="0 0 26 26" aria-hidden="true">
                                <circle class="context-track" cx="13" cy="13" r="12" pathLength="100"></circle>
                                <circle class="context-arc" cx="13" cy="13" r="12" pathLength="100"></circle>
                            </svg>
                            <span></span>
                        </button>
                        <button type="submit" id="btn-send-chat" class="btn">
                            <i class="codicon codicon-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </form>
        </aside>

        <div id="notification-container"></div>
        <div id="drop-overlay"><span data-i18n="tree.drop"></span></div>
    </div>

    <dialog id="confirm-dialog" aria-describedby="confirm-message">
        <p id="confirm-message"></p>
        <div class="confirm-actions">
            <button type="button" id="confirm-cancel" class="btn btn-text btn-text-chat" data-i18n="changes.cancel"></button>
            <button type="button" id="confirm-ok" class="btn btn-text btn-primary" data-i18n="confirm.discard"></button>
        </div>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <header class="dialog-head">
            <button type="button" id="settings-back" class="btn hidden" data-i18n-title="settings.back">
                <i class="codicon codicon-arrow-left"></i>
            </button>
            <h2 id="settings-title"></h2>
            <button type="button" id="settings-close" class="btn" data-i18n-title="settings.close">
                <i class="codicon codicon-close"></i>
            </button>
        </header>

        <div class="dialog-body">
            <section data-page="main">
                <h3 class="section-title"><span data-i18n="settings.model"></span><button type="button" class="info" data-tip="settings.modelTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button></h3>
                <div class="field">
                    <span class="field-label" id="provider-label" data-i18n="settings.provider"></span>
                    <button type="button" id="provider-trigger" class="select-trigger" aria-haspopup="listbox" aria-labelledby="provider-label"><span></span><i class="codicon codicon-chevron-down"></i></button>
                </div>
                <div class="field hidden" id="field-base-url">
                    <label class="field-label" for="input-base-url" data-i18n="settings.baseUrl"></label>
                    <input id="input-base-url" type="url" placeholder="https://" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                    <div class="field-label">
                        <label for="input-api-key" data-i18n="settings.apiKey"></label>
                        <button type="button" class="info" data-tip="settings.apiKeyTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                        <a id="key-link" class="field-link" target="_blank" rel="noopener noreferrer" data-i18n="settings.getKey"></a>
                    </div>
                    <input id="input-api-key" type="password" placeholder="sk-" autocomplete="off" spellcheck="false">
                    <button type="button" id="btn-clear-key" class="field-link hidden" data-i18n="settings.clearKey"></button>
                </div>
                <div class="field">
                    <div class="field-label">
                        <span id="model-label" data-i18n="settings.defaultModel"></span>
                        <button type="button" class="info" data-tip="settings.defaultModelTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                    </div>
                    <button type="button" id="model-trigger" class="select-trigger" aria-haspopup="listbox" aria-labelledby="model-label"><span></span><i class="codicon codicon-chevron-down"></i></button>
                </div>
                <div class="field hidden" id="field-effort">
                    <div class="field-label">
                        <span id="effort-label" data-i18n="settings.defaultEffort"></span>
                        <button type="button" class="info" data-tip="settings.defaultEffortTip" data-i18n-label="settings.info"><i class="codicon codicon-info"></i></button>
                    </div>
                    <button type="button" id="effort-trigger" class="select-trigger" aria-haspopup="listbox" aria-labelledby="effort-label"><span></span><i class="codicon codicon-chevron-down"></i></button>
                </div>
                <p id="connection-status" role="status"></p>

                <h3 class="section-title" data-i18n="settings.appearance"></h3>
                <div class="field">
                    <span class="field-label" data-i18n="settings.theme"></span>
                    <div class="segments">
                        <button type="button" data-theme-option="system" data-i18n="settings.themeSystem"></button>
                        <button type="button" data-theme-option="light" data-i18n="settings.themeLight"></button>
                        <button type="button" data-theme-option="dark" data-i18n="settings.themeDark"></button>
                    </div>
                </div>
                <div class="field">
                    <span class="field-label" data-i18n="settings.language"></span>
                    <div class="segments">
                        <button type="button" data-lang-option="zh">简体中文</button>
                        <button type="button" data-lang-option="en">English</button>
                    </div>
                </div>

                <button type="button" class="settings-link" data-go="context"><span data-i18n="context.title"></span><i class="codicon codicon-chevron-right"></i></button>
                <button type="button" class="settings-link" data-go="about"><span data-i18n="settings.about"></span><i class="codicon codicon-chevron-right"></i></button>
            </section>

            <section data-page="about" class="hidden">
                <div class="about-head">
                    <div class="product-logo" data-i18n-label="brand.label">Caret<svg class="product-logo-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#f06b32"/><path d="M13 16H51V28H38V48H26V28H13Z" fill="#fff"/></svg></div>
                    <p class="about-version"><span data-i18n="about.version"></span> <span id="about-version"></span></p>
                </div>
                <p data-i18n="about.body1"></p>
                <p data-i18n="about.body2"></p>
                <dl class="about-facts">
                    <div><dt data-i18n="about.publisher"></dt><dd class="about-publisher"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#f06b32"/><path d="M13 16H51V28H38V48H26V28H13Z" fill="#fff"/></svg>榫卯 Tenon AI</dd></div>
                    <div><dt data-i18n="about.website"></dt><dd><a href="https://tenon.asia/" target="_blank" rel="noopener noreferrer">tenon.asia</a></dd></div>
                    <div><dt data-i18n="about.feedback"></dt><dd><a href="mailto:support@tenonai.cn">support@tenonai.cn</a></dd></div>
                    <div><dt data-i18n="about.source"></dt><dd><a href="https://github.com/dozybot001/Caret" target="_blank" rel="noopener noreferrer">GitHub</a></dd></div>
                    <div><dt data-i18n="about.license"></dt><dd><a href="https://github.com/dozybot001/Caret/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT</a></dd></div>
                </dl>
                <button type="button" class="settings-link" data-go="privacy"><span data-i18n="about.privacy"></span><i class="codicon codicon-chevron-right"></i></button>
                <button type="button" class="settings-link" data-go="terms"><span data-i18n="about.terms"></span><i class="codicon codicon-chevron-right"></i></button>
                <p class="filing"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">湘ICP备2026031578号-1</a><a href="https://beian.mps.gov.cn/#/query/webSearch?code=43132202001134" target="_blank" rel="noopener noreferrer">湘公网安备43132202001134号</a></p>
            </section>

            <section data-page="context" class="hidden">
                <div class="article-body"></div>
            </section>

            <section data-page="privacy" class="hidden">
                <p class="legal-meta" data-i18n="legal.meta"></p>
                <div class="article-body"></div>
            </section>

            <section data-page="terms" class="hidden">
                <p class="legal-meta" data-i18n="legal.meta"></p>
                <div class="article-body"></div>
            </section>
        </div>

        <footer class="dialog-foot">
            <button type="button" id="settings-done" class="btn btn-text btn-primary" data-i18n="settings.done"></button>
        </footer>

        <div id="select-menu" popover="auto" role="listbox"></div>
        <div id="tooltip" popover="manual" role="tooltip"></div>
    </dialog>

    <script type="module" src="main.js"></script>
</body>
</html>
